################
### Programs ###
################

# Browsers
$browser = helium-browser
$secbrowser = firefox

# Capture Utils
$sr = wf-recorder -a -r 60 -o ~/Videos/
$ss = hyprshot -m region -o ~/Pictures/hyprshot
$sss = hyprshot -m output -z -o ~/Pictures/hyprshot

# Social and Audio
$audacity = audacity
$discord = discord-canary
$dsgg = webcord
$music = cider
$music2 = spotify

# CLI Tools
$terminal = ghostty
$taskmgr = ghostty -e btop
$matrix = ghostty -e unimatrix -l aAkkkmmms -s 90 -c black
$cava = ghostty -e cava

# Hypr Ecosystems
$lock = hyprlock

# Gayming
$epic = heroic
$steam = steam

# Modding
$mods = r2modman --in-process-gpu
$hkmods = lumafly

# Misc
$fileManager = dolphin
$menu = wofi --show drun
$ide = kate
$murder = hyprctl kill
$images = aseprite

# Commands
$restartaudio = systemctl --user restart wireplumber pipewire pipewire-pulse
